# The checks that are worth their cost before something ships, and not on every pull request.
#
# **Windows.** A private repository bills Windows minutes at 2x, so the inherited arrangement — a
# full duplicate of build/typecheck/test on windows-latest for every push and every PR — cost more
# than the Ubuntu job it duplicated. The Windows-only risks in this codebase are real but they are
# *release* risks, not per-commit ones: path handling, CRLF, and DPAPI (the browser import unwraps
# Chrome's key through `CryptUnprotectData`, and Chrome 127+ App-Bound Encryption is refused there
# — see packages/desktop/src/browser-import/chrome-key.ts). None of those change from one pull
# request to the next; all of them must hold before a build goes out.
#
# (The installer jobs that also lived here were retired with the upstream terminal CLI: the
# standalone CLI bundle install.sh / install.ps1 installed no longer exists in this fork, and the
# desktop app has its own installers built by desktop-build.yml.)
#
# Run this by hand before tagging or packaging. It is deliberately not wired to a tag: it is the
# check you run *before* deciding to ship, and a check that runs after the decision is a report, not
# a gate.
name: Pre-release checks

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to check out. Empty uses the default branch."
        required: false
        type: string
        default: ""

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build, typecheck, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security guard (no debug switches in source)
        run: node packages/desktop/scripts/check-debug-switches.mjs

      - name: Build (tsup)
        run: pnpm build

      - name: Typecheck (tsc)
        run: pnpm typecheck

      # penguin-browser is excluded for the same reason as in CI: its relay suite drives a real
      # Chromium and fails on wall-clock, which says nothing about Windows.
      # No format:check — Prettier reads the same files the Ubuntu job already checked. Line endings
      # come from .gitattributes (LF working tree), so build outputs and fixtures stay byte-identical
      # across platforms and checksum-sensitive tests do not diverge here.
      - name: Unit tests (vitest)
        run: pnpm -r --filter='!penguin-browser' test
