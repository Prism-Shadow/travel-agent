# CI for travel-agent: security guard -> build -> style -> typecheck -> unit tests -> in-app
# browser end-to-end. One Ubuntu job on every push to main and every pull request.
#
# Shaped by two facts this fork has and upstream did not.
#
# **This repository is private, so Actions minutes are billed** — and billed with multipliers:
# Linux 1x, Windows 2x, macOS 10x. The inherited layout ran a full duplicate of build/typecheck/test
# on windows-latest for every push and every pull request, which cost more in billed minutes than
# the Ubuntu job it duplicated (6 min x 2 = 12, against 6). Windows now lives in pre-release.yml and
# runs before a build that ships, which is when a Windows-only defect actually matters. The trade is
# stated rather than hidden: a path/line-ending/DPAPI regression is found later than it used to be.
#
# **Nothing here publishes.** Upstream's release.yml and oss-staging.yml pushed the CLI to the public
# npm `@prismshadow` scope and an Alibaba OSS bucket that belong to PenguinHarness; neither is this
# fork's to publish to. They are gone, and with them the reason to gate every pull request on
# installer tests. Those moved to pre-release.yml too.
#
# The order of the steps is load-bearing and unchanged from upstream:
#   - the security guard runs FIRST because it is fast and its failure is severe (design/002 §11.2:
#     a shipped debug switch exposes every target in the process, the user's authenticated window
#     included, to any local caller);
#   - build runs BEFORE typecheck because core's exports point at dist/, and the downstream
#     packages' type resolution and runtime imports both need core's build output.
name: CI

# push is limited to main so a merge does not re-run what its pull request already ran. Pull
# requests carry no branch filter on purpose: this repo's PRs often target integration branches
# rather than main, and a target filter would leave those with no CI at all.
#
# Docs-only changes skip CI: nothing under docs/, design/, changelog/ or tasks/, and no
# root-level markdown, is reachable from a build or a test, so a push touching only those has
# nothing to verify (paths-ignore skips the run only when EVERY changed file matches; mixed
# pushes still run). Deliberately NOT `**/*.md`: the skill library's SKILL.md files under
# packages/ are runtime content that tests assert on, and package READMEs ride along with code
# anyway.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "design/**"
      - "changelog/**"
      - "tasks/**"
      - "*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "design/**"
      - "changelog/**"
      - "tasks/**"
      - "*.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  # event_name is in the key so a push and its pull request do not cancel each other.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pnpm version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # First, and a hard fail: a leaked --remote-debugging-port is the one defect that hands every
      # page in the process — including the user's signed-in window — to any local process, with no
      # authentication. Fuses are a separate check, made at package time against the built binary
      # (desktop-build.yml).
      - name: Security guard (no debug switches in source)
        run: node packages/desktop/scripts/check-debug-switches.mjs

      - name: Build (tsup)
        run: pnpm build

      - name: Code style (Prettier)
        run: pnpm format:check

      - name: Typecheck (tsc)
        run: pnpm typecheck

      # Everything except penguin-browser, whose relay suite needs a real Chromium and a real
      # display and is currently unreliable on a shared runner — it runs in its own job below so a
      # timing-sensitive click cannot block a merge. Excluding it here rather than marking this job
      # continue-on-error keeps a genuine failure in the other eight packages fatal.
      - name: Unit tests (vitest)
        run: pnpm -r --filter='!penguin-browser' test

      # Electron needs unprivileged user namespaces for its sandbox, and Ubuntu 23.10+ restricts
      # them through AppArmor by default — on the 24.04 runner that makes Chromium die before it
      # initialises, in under a second, with *both* output streams empty. (The first run of this
      # gate failed exactly that way; it reproduced on the runner and not on a Debian dev box,
      # which has no such restriction.)
      #
      # Relaxed here rather than passing `--no-sandbox` to Electron. The sandbox is a security
      # boundary of the thing under test, and a gate that only passes with it switched off is
      # testing a configuration the product never ships. Best-effort on purpose: `|| true` so a
      # future runner image that drops the knob does not fail the build over a setting it no
      # longer has.
      - name: Allow Electron's sandbox (Ubuntu 24.04 userns restriction)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # The one thing unit tests cannot reach: a real Electron main process, a real preload, a real
      # WebContentsView and a real relay. The runner discovers xvfb-run itself and refuses to skip
      # when CI=true, so this step cannot go green by quietly deciding it could not run. Ubuntu only
      # — the GitHub Windows runner has no display server, and the Electron pieces under test are
      # not platform-specific.
      - name: In-app browser end-to-end (Electron, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          pnpm --filter @prismshadow/penguin-desktop test:e2e

  # penguin-browser, reported but not blocking — for now.
  #
  # This job was split out when the suite was red and the failures were written down here as
  # "properties of the runner, not of the code". **That was wrong**, and the correction is worth
  # keeping: every one of the seven had a definite cause in the tests themselves — a click budget
  # too small to finish one actionability probe, a harness faking dark mode with a per-client
  # emulation the process under test could not observe, an unguarded read of a log the healthy run
  # never writes, a third party's page height pinned in an inline snapshot, and — the one that made
  # the set of failures move between runs — every suite truncating a *shared* CDP log that vitest's
  # parallel workers were all writing to. All are fixed; the suite now passes 550/550.
  #
  # The job stays non-blocking for a short while only, because the last of those was a race and one
  # green run is not proof. Fold it back into the job above once a few CI runs have come back clean;
  # leaving it non-blocking indefinitely would recreate the thing it was meant to prevent — a result
  # nobody reads.
  browser-cli:
    name: penguin-browser (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (tsup)
        run: pnpm build

      # This suite launches a real Chromium through the vendored Playwright fork, and a GitHub
      # runner ships none — every browser-backed file failed at setup with "Executable doesn't
      # exist at ~/.cache/ms-playwright/chromium-1209". `docs/verification/phase-00.md` recorded
      # this gap when the fork was vendored and nothing closed it; nobody hit it because Actions had
      # never been enabled on this repository until now.
      #
      # `playwright-core`, not `playwright`: the dependency is @xmorse/playwright-core, and its
      # `install` resolves the browser build its own version pins (verified with --dry-run to be
      # chromium-1209, the build the runner reported missing).
      #
      # Without `--with-deps`, which is broken in this fork: it completes the apt step and then dies
      # in the download with `TypeError: onExit is not a function`, so the browser never lands. The
      # ubuntu-latest image already carries Chromium's shared libraries — the apt run it did before
      # crashing found nothing to restart — so the flag was buying nothing here anyway. A genuinely
      # missing library would surface as a clear loader error rather than as this silence.
      - name: Install Chromium for Playwright
        run: pnpm --filter penguin-browser exec playwright-core install chromium

      - name: Unit tests (penguin-browser)
        run: pnpm --filter penguin-browser test

      # What a snapshot failure actually was, when it only happens here.
      #
      # Vitest prints an Expected/Received diff for `toMatchFileSnapshot`, but on this runner the
      # failure block arrives interleaved with the summary writer and the diff is lost — a
      # `getPageMarkdown` snapshot failed with the log carrying the code frame and nothing else,
      # while the same command passed locally. Re-running the suite with `-u` rewrites the snapshot
      # files with what *this machine* produced, so `git diff` is the difference, exactly.
      #
      # Diagnostic only: it runs after the job has already failed, changes nothing that is kept
      # (the checkout is thrown away), and cannot turn a red job green — `if: failure()` and the
      # trailing `|| true` keep it from affecting the outcome either way.
      - name: Snapshot diff (diagnostic, on failure only)
        if: failure()
        run: |
          pnpm --filter penguin-browser exec vitest run --no-file-parallelism -u || true
          echo "--- snapshot files as this runner produced them ---"
          git --no-pager diff -- 'packages/browser-cli/**/snapshots/**' 'packages/browser-cli/**/*.snap' || true

  # The live-model end-to-end, on main only.
  #
  # It spends real tokens, so it does not run per pull request. It is the only test that exercises
  # the actual agent loop against a real model, which is why it runs at all.
  live-e2e:
    name: Live LLM end-to-end
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (tsup)
        run: pnpm build
      # The secret is exposed only in this step, so no earlier step and no third-party action can
      # read it. The secrets context cannot be used in an `if:`, so the skip is inside the shell.
      - name: E2E (live LLM via DeepSeek)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY not configured; skipping the live end-to-end."
            exit 0
          fi
          pnpm test:e2e
